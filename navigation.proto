syntax = "proto3";

package navigation;

service NavigationService {
  rpc CalculateRoute (RouteRequest) returns (RouteResponse);
  rpc StreamSonarMap (SonarMapRequest) returns (stream SonarReading);
  rpc UploadWaypoints (stream Waypoint) returns (WaypointUploadAck);
  rpc LiveNavigation (stream NavCommand) returns (stream NavUpdate);
}

message RouteRequest {
  string origin = 1;
  string destination = 2;
}

message RouteResponse {
  repeated string path = 1;
  double estimated_time = 2;
  string status = 3;
  double drift_status = 4;
}

message SonarMapRequest {
  string zone_id = 1;
}

message SonarReading {
  string zone_id = 1;
  double depth = 2;
  double impact_distance = 3;
  string timestamp = 4;
}

message Waypoint {
  string id = 1;
  double latitude = 2;
  double longitude = 3;
  double depth = 4;
}

message WaypointUploadAck {
  int32 total_received = 1;
  bool success = 2;
  string message = 3;
}

message NavCommand {
  string command_type = 1;
  double value = 2;
}

message NavUpdate {
  string status = 1;
  string timestamp = 2;
}
