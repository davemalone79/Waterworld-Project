syntax = "proto3";

package trade;

service TradeService {
  rpc GetResourcePrice (PriceRequest) returns (PriceResponse);
  rpc StreamMarketUpdates (MarketRequest) returns (stream MarketUpdate);
  rpc UploadTradeBatch (stream TradeItem) returns (TradeBatchAck);
  rpc LiveTrading (stream TradeCommand) returns (stream TradeEvent);
}

message PriceRequest {
  string resource_name = 1;
}

message PriceResponse {
  string item_name = 1;
  double price = 2;
  string currency = 3;
  string timestamp = 4;
  double volatility = 5;
}

message MarketRequest {
  string sector = 1;
}

message MarketUpdate {
  string resource_name = 1;
  double price = 2;
  double change_percent = 3;
  string timestamp = 4;
}

message TradeItem {
  string item_id = 1;
  string item_name = 2;
  int32 quantity = 3;
}

message TradeBatchAck {
  int32 total_items = 1;
  bool success = 2;
  string message = 3;
}

message TradeCommand {
  string command_type = 1;
  string resource_name = 2;
  int32 quantity = 3;
}

message TradeEvent {
  string event_type = 1;
  string details = 2;
  string timestamp = 3;
}
